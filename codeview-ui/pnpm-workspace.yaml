packages:
  - .

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

saveExact: true
strictPeerDependencies: true
engineStrict: true

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  "@tailwindcss/oxide": true
  msgpackr-extract: true

patchedDependencies:
  "@jesterkit/exe-sveltekit@0.1.7": patches/@jesterkit__exe-sveltekit@0.1.7.patch

overrides:
  clsx: 2.1.1
  fast-xml-parser: ">=5.3.4"
  dompurify: ">=3.2.4"
  nanoid: ">=5.0.9"
  mermaid: ">=10.9.4"
  cookie: ">=0.7.0"

minimumReleaseAgeExclude:
  - "@sveltejs/kit"
  - effect
  - "@effect/sql-sqlite-do"
  - "@effect/sql-d1"
  - "@effect/vitest"
  - "@effect/platform-node"
  - "@effect/platform-node-shared"
  - drizzle-orm
  - drizzle-kit
  - alchemy
  - "@alchemy.run/frontend-frameworks"
  - "@alchemy.run/better-auth"
  - better-auth
  - "@better-auth/passkey"
  - "@cloudflare/workers-types"
  - hono
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.83"
  - "@alchemy.run/floci@2.0.0-beta.83"
  - "@alchemy.run/node-utils@2.0.0-beta.83"
  - "@distilled.cloud/acme@1.0.0-rc.15"
  - "@distilled.cloud/aws@1.0.0-rc.15"
  - "@distilled.cloud/axiom@1.0.0-rc.15"
  - "@distilled.cloud/cloudflare@1.0.0-rc.15"
  - "@distilled.cloud/core@1.0.0-rc.15"
  - "@distilled.cloud/doppler@1.0.0-rc.15"
  - "@distilled.cloud/fly-io@1.0.0-rc.15"
  - "@distilled.cloud/gcp@1.0.0-rc.15"
  - "@distilled.cloud/hetzner@1.0.0-rc.15"
  - "@distilled.cloud/iceberg@1.0.0-rc.15"
  - "@distilled.cloud/infisical@1.0.0-rc.15"
  - "@distilled.cloud/neon@1.0.0-rc.15"
  - "@distilled.cloud/planetscale@1.0.0-rc.15"
  - "@distilled.cloud/prisma@1.0.0-rc.15"
  - "@distilled.cloud/railway@1.0.0-rc.15"
  - "@distilled.cloud/stripe@1.0.0-rc.15"
  - "@distilled.cloud/turso@1.0.0-rc.15"
  - "@distilled.cloud/zerossl@1.0.0-rc.15"

peerDependencyRules:
  allowedVersions:
    better-auth: "1.7.7"
    "@cloudflare/workers-types": ">=5"
    vite: "1.1.0"
    drizzle-orm: "1.0.0-rc.5-ab785fc"
    "@sveltejs/kit": "3.0.1"
    # Declares typescript ^5 as a peer but never imports it.
    "@jesterkit/exe-sveltekit>typescript": "6"
